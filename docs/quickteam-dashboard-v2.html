QUICKTEAM — ÜBERARBEITETER HTML-ENTWURF
Eigenständige lokale Variante. Kein Backend, keine Speicherung, keine Übermittlung.
Basisfarben und Radien: QuickTeamFront, lesend geprüft auf d942674.
Bewusste visuelle Abweichungen: Gabarito als einzige Dashboard-Schrift;
zusätzliche Rollenfarben als Vorschlag; Bronze Hi für kleine Akzenttexte.

Fachlich übernommen:
- Anstellungsdaten optional; Vertragsart erlaubt Keine Angabe.
- Sollstunden-Eingabe pro Woche; Hinweis auf Monatswert × 4,33.
- Sollstunden-Warnung nur im Planungsbereich, kein Einladungs-Blocker.

- Abrechnung abgeschlossen bis: optionales Datum mit Leeren.
- Urlaub in Kalendertagen; Wochenenden zählen mit.

Für eine spätere React-Übertragung bestehende Komponenten weiterverwenden:
DatumWahl, MonatsSpringer, Uebernehmen und Skelett.
Die HTML-Popover sind ausschließlich visuelle, lokal bedienbare Entsprechungen.
Die echte Codebasis wurde nicht verändert.

Prüfung: 23 Ansichts-/Dialogzustände strukturell validiert, JS-Syntax geprüft.
Berechneter Muted-Kontrast: dunkel min. 4,72:1; hell min. 5,65:1.
Kein visueller Browser-/Lighthouse-Nachweis: Zugriff auf file:-URLs war gesperrt.
-->

let calYear=2026,calMonth=8,calSparse=false;const months=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function monthPicker(){return `<div class="popover-anchor">${btn(months[calMonth]+' '+calYear,"pop('month-pop')",'','down')}<div class="popover" id="month-pop" hidden><div class="flex between"><button class="icon-btn" onclick="changeYear(-1)" aria-label="Vorheriges Jahr">${ico('left')}</button><strong id="picker-year">${calYear}</strong><button class="icon-btn" onclick="changeYear(1)" aria-label="Nächstes Jahr">${ico('chevron')}</button></div><div class="month-grid">${months.map((m,i)=>`<button class="${i===calMonth?'selected':''}" onclick="setMonth(${i})">${m.slice(0,3)}${i===2?'z':''}</button>`).join('')}</div></div></div>`}
function changeYear(n){calYear+=n;document.getElementById('picker-year').textContent=calYear}function setMonth(n){calMonth=n;render()}function moveMonth(n){calMonth+=n;if(calMonth<0){calMonth=11;calYear--}if(calMonth>11){calMonth=0;calYear++}render()}
function calendar(){return head('Der Schichtplan','Ein guter Service beginnt mit einem guten Plan.',btn('Schicht planen',"location.hash='planning'",'primary','plus'))+`<div class="calendar-toolbar"><div class="flex">${monthPicker()}<button class="icon-btn" onclick="moveMonth(-1)" aria-label="Vorheriger Monat">${ico('left')}</button><button class="icon-btn" onclick="moveMonth(1)" aria-label="Nächster Monat">${ico('chevron')}</button>${btn('Heute','calYear=2026;calMonth=8;render()','small')}</div><div class="flex"><span class="small muted">Beispielbelegung</span><div class="day-tabs"><button class="${!calSparse?'selected':''}" onclick="calSparse=false;render()">Servicewoche</button><button class="${calSparse?'selected':''}" onclick="calSparse=true;render()">Wenig Einträge</button></div><span class="badge">Monat</span></div></div><div class="calendar-viewport"><div class="calendar">${['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'].map((d,i)=>`<div class="weekday ${i>3?'weekend-label':''}">${d}</div>`).join('')}${calendarDays()}</div></div><div class="legend">${['Service','Bar','Küche','Runner'].map(n=>`<span class="${{Service:'service',Bar:'bar',Küche:'kitchen',Runner:'runner'}[n]}"><i></i>${n}</span>`).join('')}<span><i class="dashed"></i>Frei zu übernehmen</span><span>↳ Fortsetzung am Folgetag</span><span style="margin-left:auto">Fr–So · Wochenendservice</span></div><p class="calendar-help">${ico('info')}<span>Eine Schicht anklicken für Details. Nachtschichten erscheinen als Fortsetzung am Folgetag.</span></p>`}
function chip(time,r,filled,open=false,extra=''){const name={service:'Service',bar:'Bar',kitchen:'Küche',runner:'Runner'}[r],next=time.includes('+1'),display=time.replace(' +1','').replace('↳ ','');return `<button class="shift-chip ${r} ${open?'open':''} ${extra}" onclick="openShift('${time}','${r}','${filled}',${open},'${extra}',this)" aria-label="${name}, ${display}${next?', Ende am Folgetag':''}${extra==='continuation'?', Fortsetzung vom Vortag':''}, ${open?'eine Position offen':filled+' besetzt'}"><time>${extra==='continuation'?'↳ ':''}${display}</time><span class="chip-bottom"><span>${name}</span><span>${open?'1 offen':filled}</span></span>${next?'<span class="night-note">bis zum Folgetag ↗</span>':''}</button>`}
function calendarDays(){let start=(new Date(calYear,calMonth,1).getDay()+6)%7,count=new Date(calYear,calMonth+1,0).getDate(),total=Math.ceil((start+count)/7)*7,out='';for(let i=0;i<total;i++){const dt=new Date(calYear,calMonth,i-start+1),d=dt.getDate(),adj=dt.getMonth()!==calMonth,weekday=i%7,today=d===8&&!adj&&calMonth===8&&calYear===2026;let content='';if(!adj&&weekday!==0){if(calSparse){if([3,8,12,18,24].includes(d))content=chip('11:00–17:00','service','2/2');if(d===12)content+=chip('18:00–23:00','bar','0/1',true)}else{content=chip('09:00–16:00','kitchen','3/3')+chip('11:00–17:00','service','3/3');if(weekday>=4||d===8)content+=chip('16:00–23:00','service','4/4');if(d===8)content+=chip('18:00–00:00','bar','1/2',true);if(weekday===4)content+=chip('17:00–23:00','runner',d===11?'0/1':'1/1',d===11)+chip('18:00–02:00 +1','bar',d===11?'1/2':'2/2',d===11,'night');if(weekday===5)content=chip('↳ 00:00–02:00','bar',d===12?'1/2':'2/2',d===12,'continuation')+content+chip('18:00–01:00 +1','bar','2/2',false,'night');if(weekday===6)content=chip('↳ 00:00–01:00','bar','2/2',false,'continuation')+content;if(d===12)content+=chip('17:00–23:00','runner','0/1',true)}}if(!adj&&weekday===0)content='<span class="empty-day">Ruhetag</span>';out+=`<div class="day ${adj?'adjacent':''} ${weekday>=4?'weekend':''} ${today?'today':''}" data-date="${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}"><div class="day-heading"><span class="day-num">${d}${adj?' '+months[dt.getMonth()].slice(0,3)+'.':''}</span>${today?'<span class="today-label">Heute</span>':''}</div>${content}</div>`}return out}
function pop(id){const el=document.getElementById(id),was=el.hidden;closePopovers();el.hidden=!was;const trigger=document.querySelector(`[aria-controls="${id}"]`);trigger?.setAttribute('aria-expanded',String(was));if(was){if(el.querySelector('[id$="-dates"]'))drawDate(id.replace('-pop',''));const selected=el.querySelector('.time-options .selected');selected?.scrollIntoView({block:'nearest'});(selected||el.querySelector('button'))?.focus()}}
function field(label,value='',hint='',type='text',required=true){const id='field-'+(++fieldId);return `<div class="field"><label for="${id}">${label}${required?' <span class="required">*</span>':' <span class="optional">optional</span>'}</label><input id="${id}" name="${id}" type="${type}" value="${value}" ${required?'required':''} ${type==='number'?'step="any" inputmode="decimal"':''} autocomplete="off" ${hint?`aria-describedby="${id}-hint"`:''}>${hint?`<small id="${id}-hint">${hint}</small>`:''}</div>`}let fieldId=0;
function dropdown(label,options,value,id,required=true){return `<div class="field"><span class="field-label" id="${id}-label">${label}${required?' <span class="required">*</span>':' <span class="optional">optional</span>'}</span><div class="popover-anchor"><button type="button" class="field-control" aria-labelledby="${id}-label ${id}-value" aria-expanded="false" aria-controls="${id}-pop" onclick="pop('${id}-pop')"><span id="${id}-value">${value}</span>${ico('down')}</button><div class="popover" id="${id}-pop" hidden style="width:100%"><div class="option-list">${options.map(o=>`<button type="button" onclick="choose('${id}',this.textContent)">${o}</button>`).join('')}</div></div></div></div>`}
function choose(id,v){const e=document.getElementById(id+'-value');e.textContent=v;e.classList.toggle('muted',v==='Kein Stichtag');closePopovers();document.querySelector(`[aria-controls="${id}-pop"]`)?.focus()}

function openShift(time,r,filled,open,extra,el){selectedShift={time,r,filled,open,extra,date:el.closest('.day').dataset.date};location.hash='detail'}
function detail(){const s=selectedShift||{time:'18:00–00:00',r:'bar',filled:'1/2',open:true,date:'2026-09-08',extra:'night'},rn={bar:'Bar',service:'Service',kitchen:'Küche',runner:'Runner'}[s.r],date=new Date(s.date+'T12:00:00'),label=date.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'}),needed=Number(s.filled.split('/')[1]),filled=Number(s.filled.split('/')[0]),next=s.time.includes('+1')||s.time.endsWith('00:00'),title=s.r==='bar'?'Abendbar':s.r==='kitchen'?'Vorbereitung & Mittagsservice':s.r==='runner'?'Unterstützung Abendservice':s.time.startsWith('11')?'Mittagsservice':'Abendservice';return head(title,label,btn('Zum Kalender',"location.hash='calendar'",'','calendar'))+`<section class="shift-hero" style="box-shadow:inset 4px 0 var(--${s.r==='kitchen'?'kitchen':s.r})"><div class="flex between">${role(rn)}<span class="badge ${s.open?'gold':'active'}">${s.open?'Frei zu übernehmen':'Vollständig besetzt'}</span></div><h2>${title}</h2><div class="flex wrap"><time>${s.time}</time>${next?'<span class="badge">Endet am Folgetag</span>':''}${s.extra==='continuation'?'<span class="badge">Fortsetzung vom Vortag</span>':''}</div><p class="small" style="margin-top:15px">Brasserie Linde · ${needed} ${needed===1?'Person benötigt':'Personen benötigt'} · ${filled} ${filled===1?'Person zugewiesen':'Personen zugewiesen'}</p></section><div class="two-col"><section class="card"><div class="section-head"><h2>Besetzung nach Rolle</h2><span class="mono small muted">${s.filled}</span></div><div class="flex between mb">${role(rn)}<span class="small muted">${needed} benötigt</span></div>${Array.from({length:filled},(_,i)=>`<div class="open-role">${avatar((s.r==='bar'?['JB','SB']:s.r==='kitchen'?['LF','TN','MS']:['AW','EM','DB','NH'])[i%4])}<div class="grow"><strong>${(s.r==='bar'?['Jonas Berger','Sofia Bauer']:s.r==='kitchen'?['Lukas Fischer','Tobias Neumann','Mia Steiner']:['Anna Weber','Elena Moser','David Braun','Nora Huber'])[i%4]}</strong><p>Zugewiesen · ${rn}</p></div><span class="badge active">Bestätigt</span></div>`).join('')}${s.open?`<div class="open-role" style="outline:1px dashed var(--accent);background:var(--accent-soft)"><span class="action-icon">${ico('plus')}</span><div class="grow"><strong>Frei zu übernehmen</strong><p>Eine Person mit der Rolle ${rn} gesucht</p></div>${btn('Übernehmen','demo()','primary small')}</div>`:''}<p class="small mt">Diese Einzelschicht benötigt ausschließlich die oben aufgeführten Rollen.</p></section><aside class="card"><h2>Gut zu wissen</h2><div class="stack mt"><div><h3 class="small">Vor dem Service</h3><p class="small" style="margin-top:7px">Bitte 10 Minuten für das gemeinsame Briefing einplanen. Die Vorbereitung beginnt innerhalb der Schichtzeit.</p></div><div><h3 class="small">Ansprechperson</h3><div class="flex" style="margin-top:13px">${avatar('MK','warm')}<div><strong class="small">Marie Koller</strong><p class="small">Betriebsleitung</p></div></div></div></div></aside></div>`}
let authMode='login';function auth(){const tabs=[['login','Anmelden'],['register','Registrieren'],['forgot','Passwort vergessen'],['reset','Neues Passwort']];return head('Anmeldung & Konto','Ein klarer Einstieg für dein Team.')+`<div class="auth-tabs">${tabs.map(([id,t])=>`<button class="${authMode===id?'selected':''}" onclick="authMode='${id}';render()">${t}</button>`).join('')}</div><section class="auth-layout"><div class="auth-story"><div class="brand"><span class="gold">Q.</span> QuickTeam</div><div><span class="eyebrow">Dein Team. Gut organisiert.</span><h2>Das Team.<br>Der Plan.<br><span class="gold">Ein guter Service.</span></h2><p>Alles, was hinter einem gelungenen Abend steckt. An einem Ort.</p><div class="auth-schedule"><div class="flex between mb"><strong>Heute Abend</strong><span class="badge active">Alles bereit</span></div>${schedule('16:00','23:00','Abendservice','Service',['AW','EM','SB'])}</div></div><p class="small mt">Für die Menschen hinter der Gastlichkeit.</p></div><div class="auth-form">${authContent()}</div></section>`}
function authInput(label,value,id,hint,invalid=false,password=false){return `<div class="field"><label for="${id}">${label} <span class="required">*</span></label><input id="${id}" name="${id}" type="${password?'password':id.includes('email')?'email':'text'}" value="${value}" class="${invalid?'invalid':''}" aria-invalid="${invalid}" aria-describedby="${id}-hint" required autocomplete="${password?(id==='login-pass'?'current-password':'new-password'):id.includes('email')?'email':'off'}" ${id.includes('email')?'spellcheck="false"':''} oninput="validateAuth(this)" onblur="validateAuth(this)"><small id="${id}-hint" data-default="${hint}" aria-live="polite" class="${invalid?'validation':''}">${invalid?ico('info'):''}${hint}</small></div>`}
function authContent(){if(authMode==='register')return `<h2>Deinen Betrieb anlegen</h2><p class="small">Starte mit deinem persönlichen Zugang.</p><div class="stack">${authInput('Dein Name','Marie Koller','reg-name','So sieht dich dein Team.')}${authInput('Betriebsname','Brasserie Linde','reg-business','Wird in Einladungen angezeigt.')}${authInput('E-Mail','marie@','reg-email','Bitte ergänze eine vollständige E-Mail-Adresse.',true)}${authInput('Passwort','Linde26','reg-pass','Mindestens 12 Zeichen verwenden; aktuell sind es 7.',true,true)}${btn('Konto erstellen','authSubmit()','primary full')}</div>`;if(authMode==='forgot')return `<h2>Passwort vergessen?</h2><p class="small">Du erhältst einen Link, um ein neues Passwort festzulegen.</p><div class="stack">${authInput('E-Mail','marie@','forgot-email','Die Domain fehlt, z. B. restaurant.at.',true)}${btn('Link anfordern','authSubmit()','primary full')}<button class="text-link" onclick="authMode='login';render()">${ico('left')} Zurück zur Anmeldung</button></div>`;if(authMode==='reset')return `<h2>Ein neues Passwort</h2><p class="small">Wähle ein langes Passwort, das du nur hier verwendest.</p><div class="stack">${authInput('Neues Passwort','UnserAbend2026!','reset-pass','Mindestens 12 Zeichen · erfüllt',false,true)}${authInput('Passwort wiederholen','UnserAbend2025!','repeat-pass','Die Passwörter stimmen noch nicht überein.',true,true)}${btn('Passwort speichern','authSubmit()','primary full')}</div>`;return `<h2>Schön, dass du da bist.</h2><p class="small">Melde dich bei deinem Betrieb an.</p><div class="stack">${authInput('E-Mail','marie@linde.example','login-email','Vollständige E-Mail-Adresse ✓')}${authInput('Passwort','','login-pass','Bitte gib dein Passwort ein.',true,true)}<div style="text-align:right"><button class="text-link" onclick="authMode='forgot';render()">Passwort vergessen?</button></div>${btn('Anmelden','authSubmit()','primary full','arrow')}<p class="small" style="text-align:center">Neu hier? <button class="text-link" onclick="authMode='register';render()">Betrieb registrieren</button></p></div>`}

function closePopovers(){document.querySelectorAll('.popover').forEach(p=>p.hidden=true);document.querySelectorAll('[aria-expanded][aria-controls]').forEach(b=>{if(b.getAttribute('aria-controls')!=='sidebar')b.setAttribute('aria-expanded','false')})}
function toggleMobileNav(force){const side=document.getElementById('sidebar'),open=force===undefined?!side.classList.contains('open'):force;side.classList.toggle('open',open);document.getElementById('nav-shade').hidden=!open;document.querySelector('.mobile-menu').setAttribute('aria-expanded',String(open));document.querySelector('.workspace').inert=open;document.body.style.overflow=open?'hidden':'';if(open)side.querySelector('a').focus();else document.querySelector('.mobile-menu').focus()}
function validateAuth(el){const id=el.id,v=el.value.trim();let error='';if(!v)error='Bitte '+(id.includes('pass')?'dein Passwort eingeben.':'dieses Feld ausfüllen.');else if(id.includes('email')&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))error='Bitte eine vollständige E-Mail-Adresse eingeben.';else if(id==='repeat-pass'&&el.value!==document.getElementById('reset-pass').value)error='Die Passwörter stimmen noch nicht überein.';else if(id.includes('pass')&&id!=='login-pass'&&el.value.length<12)error='Mindestens 12 Zeichen verwenden; aktuell sind es '+el.value.length+'.';el.setAttribute('aria-invalid',String(!!error));el.classList.toggle('invalid',!!error);const hint=document.getElementById(id+'-hint');hint.classList.toggle('validation',!!error);hint.textContent=error||(id.includes('pass')?'Passwort eingegeben.':id.includes('email')?'Vollständige E-Mail-Adresse.':'Angabe vollständig.');if(id==='reset-pass'){const repeat=document.getElementById('repeat-pass');if(repeat?.value)validateAuth(repeat)}return !error}
function authSubmit(){const fields=[...document.querySelectorAll('.auth-form input')];let first=null;fields.forEach(el=>{if(!validateAuth(el)&&!first)first=el});if(first)first.focus();else demo()}
document.addEventListener('click',e=>{if(!e.target.closest('.popover-anchor'))closePopovers()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePopovers();if(document.getElementById('sidebar').classList.contains('open'))toggleMobileNav(false)}});
window.addEventListener('hashchange',()=>{document.getElementById('nav-shade').hidden=true;document.querySelector('.mobile-menu').setAttribute('aria-expanded','false');document.querySelector('.workspace').inert=false;document.body.style.overflow='';if(location.hash!=='#main')document.getElementById('main').focus({preventScroll:true})});

const pages={overview,calendar,team,planning,messages,vacation,availability,swap,emergency,settings,detail,auth};
function render(){const id=location.hash.slice(1)||'overview',key=pages[id]?id:'overview';fieldId=0;document.getElementById('main').innerHTML=pages[key]()+footer();document.getElementById('crumb').textContent=navItems.find(n=>n[0]===key)?.[1]||({settings:'Betriebseinstellungen',detail:'Schichtdetails',auth:'Anmeldung & Konto'}[key]);document.querySelectorAll('[data-nav]').forEach(a=>{const active=a.dataset.nav===(key==='detail'?'calendar':key);a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.getElementById('sidebar').classList.remove('open');initDates();document.querySelectorAll('.stepper').forEach(s=>{if(s.getAttribute('aria-label')==='Frist-Tag'||s.getAttribute('aria-label')==='Stichtag')s.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const o=s.querySelector('output');o.textContent=Math.min(28,+o.textContent)}))})}
window.addEventListener('hashchange',()=>{if(location.hash==='#main')return;closeModal();render();window.scrollTo(0,0)});document.addEventListener('click',e=>{if(!e.target.closest('.popover-anchor'))document.querySelectorAll('.popover').forEach(p=>p.hidden=true)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.querySelectorAll('.popover').forEach(p=>p.hidden=true);document.getElementById('sidebar').classList.remove('open')}const dlg=document.querySelector('.drawer');if(e.key==='Tab'&&dlg){const controls=[...dlg.querySelectorAll('button,a,input,textarea')].filter(el=>el.offsetParent!==null),first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
</script>
</body>
</html>
