# Netlify-Konfiguration.
#
# Bewusst kurz. Netlify erkennt Next.js von allein und wendet seinen
# Next.js-Adapter automatisch an — dieser Datei geht es nur um zwei
# Dinge, die Netlify *nicht* erraten kann:
#
#  1. `command`. `npm run build` läuft über `scripts/next-getrennt.mjs`.
#     Lokal setzt das Skript `NEXT_DIST_DIR=.next-build`, damit ein
#     gleichzeitig laufender Dev-Server nicht seine Chunks verliert. In
#     CI lässt es die Variable weg, sodass der Build wie gewohnt in
#     `.next` landet — genau dort, wo `publish` hinzeigt. Ohne diese
#     Ausnahme wäre `.next` leer und das Deployment ginge daneben.
#
#  2. `NODE_VERSION`. Ohne Angabe wählt Netlify eine Vorgabe, die sich
#     ändern kann; ein Build, der heute läuft und morgen nicht, ist
#     teurer als eine Zeile Konfiguration. 22 ist die aktive LTS-Reihe
#     und deckt die Anforderungen von Next 15 ab.
#
# Was hier bewusst **nicht** steht:
#
#  - Kein `@netlify/plugin-nextjs` unter `[[plugins]]`. Das ist die alte
#    Runtime v4; die aktuelle Next.js-Unterstützung ist in Netlify
#    eingebaut und wird beim Build von selbst angewendet. Eine
#    Pin-Angabe würde den neueren Adapter verdrängen.
#  - Keine Redirects. Alle Weiterleitungen dieses Projekts entstehen in
#    `src/middleware.ts` (Soft-Launch-Sperre) und in Next selbst. Eine
#    zweite Ebene in dieser Datei wäre eine Regel an einer Stelle, an
#    der niemand sie sucht.
#  - Keine Header. `headers()` in `next.config.ts` trägt die
#    Sicherheits-Kopfzeilen; doppelt gepflegt liefen sie auseinander.
#  - Keine Funktionsdefinitionen. Route Handler, Server Actions und die
#    Middleware bildet der Adapter selbst ab.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
